version: '3.8'

services:
  clinical-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthlink-clinical-os
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET:-healthlink-clinical-os-jwt-secret-2026}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
